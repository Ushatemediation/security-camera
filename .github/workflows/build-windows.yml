name: build-windows

# «Робот»: собирает Windows-приложение (PyInstaller) и пакует HomeCamera_Windows.zip.
# Запускается: вручную (Actions → Run workflow), при пуше в main и по тегу v*.
# На теге v* дополнительно создаёт GitHub Release с этим ZIP.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Веса YOLOv8n
        run: python -c "from ultralytics import YOLO; YOLO('yolov8n.pt')"

      - name: ffmpeg.exe
        shell: pwsh
        run: |
          curl.exe -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $exe = (Get-ChildItem -Recurse ffmpeg\ffmpeg.exe | Select-Object -First 1).FullName
          Copy-Item $exe ffmpeg.exe

      - name: Сборка приложения (PyInstaller, --onedir)
        run: python -m PyInstaller --noconfirm --clean HomeCamera.spec

      - name: Собрать релизную папку
        shell: pwsh
        run: |
          $rel = "release\HomeCamera"
          New-Item -ItemType Directory -Force -Path $rel | Out-Null

          # 1) скомпилированное приложение + все библиотеки
          Copy-Item -Recurse -Force dist\HomeCamera\* $rel

          # 2) пустая папка known/ — сюда заказчик кладёт фото
          New-Item -ItemType Directory -Force -Path "$rel\known" | Out-Null
          New-Item -ItemType File -Force -Path "$rel\known\.gitkeep" | Out-Null

          # 3) шаблон конфига -> config.yaml (сюда вписывают токен)
          Copy-Item config.example.yaml "$rel\config.yaml"
          Remove-Item "$rel\config.example.yaml" -ErrorAction SilentlyContinue

          # 4) батники и документация
          Copy-Item START_CAMERA.bat "$rel\"
          Copy-Item INSTALL_AUTOSTART.bat "$rel\"
          Copy-Item UNINSTALL.bat "$rel\"
          Copy-Item download_models.bat "$rel\"
          Copy-Item README.md "$rel\README.md"

          # 5) ffmpeg рядом с exe
          Copy-Item ffmpeg.exe "$rel\ffmpeg.exe"

          # подстраховка: ничего лишнего (логи/записи) в релиз не попало
          Remove-Item -Recurse -Force "$rel\logs" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$rel\recordings" -ErrorAction SilentlyContinue

          Write-Host "=== Содержимое релиза ==="
          Get-ChildItem $rel | Select-Object Name

      - name: Упаковать HomeCamera_Windows.zip
        shell: pwsh
        run: |
          Compress-Archive -Path "release\HomeCamera" -DestinationPath "HomeCamera_Windows.zip" -Force
          Get-Item HomeCamera_Windows.zip | Select-Object Name, @{n="MB";e={[math]::Round($_.Length/1MB,1)}}

      - name: Артефакт (скачать со страницы запуска)
        uses: actions/upload-artifact@v4
        with:
          name: HomeCamera_Windows
          path: HomeCamera_Windows.zip
          if-no-files-found: error

      - name: Release (по тегу v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: HomeCamera_Windows.zip
          generate_release_notes: true
